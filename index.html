<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilya AR Demo</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; text-align: center; }
    h1 { margin-top: 20px; }
    model-viewer { width: 100%; height: 80vh; background: white; }
  </style>
</head>
<body>

<h1>Mobilya AR Demo</h1>

<!-- iOS Quick-look kaldırıldı; sadece Android AR ve Web 3D aktif -->
<model-viewer
    src="sehpa.glb"
    alt="3D Sehpa Modeli"
    ar
    ar-placement="floor"
    ar-modes="scene-viewer webxr"
    camera-controls
    auto-rotate
    shadow-intensity="1">
</model-viewer>

</body>
</html>
