<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobilya AR Demo</title>

  <!-- Google Model Viewer Scripti -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 20px 0 10px 0;
      font-size: 1.5rem;
      color: #333;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
      background-color: #ffffff;
      touch-action: pan-y;
    }
  </style>
</head>

<body>

<h1>Mobilya AR Demo</h1>

<!-- Yalnızca GLB Odaklı ve Ölçeklendirilebilir AR Görüntüleyici -->
<model-viewer
    src="sehpa.glb"
    alt="3D Sehpa Modeli"
    ar
    ar-placement="floor"
    ar-scale="auto"
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    shadow-intensity="1">
</model-viewer>

</body>
</html>
